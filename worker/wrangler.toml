name = "leetcode-cloud-sync-worker"
main = "src/index.ts"
compatibility_date = "2026-10-30"

[triggers]
crons = ["*/2 * * * *"]

[queues]
producers = [
  { binding = "SUBMISSION_QUEUE", queue = "leetcode-submission-events" }
]
consumers = [
  { queue = "leetcode-submission-events", max_batch_size = 5, max_batch_timeout = 5, dead_letter_queue = "leetcode-submission-events-dlq" }
]

[[kv_namespaces]]
binding = "SYNC_STATE"
id = "d2fc1d81ecbb48afba1f145a56feaecf"

[vars]
GITHUB_REPO = "kaviyack/leetcode-cloud-sync"

